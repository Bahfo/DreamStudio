<!DOCTYPE html>

<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DreamJS: Your on-fly JavaScript, HTML, and CSS Code Editor</title>
        <link rel="stylesheet" href="/home/bahaa/Desktop/apps/DreamJetPack/dreamstudio_web/web_editor/editor.css">
    </head>

    <body>

        <header>
            <div class="container-row">
                <div class="brand"> <!--Here the title and logo set-->
                    <div class="logo"></div>
                    <div class="first-title">DreamJS</div>
                    <div class="title">Live JavaScript, HTML, and CSS Code Editor</div>
                </div>

                <div class="right-row">
                    <button class="btn_2" id="save-button" title="Save Work Locally">
                        <span>Save</span>
                    </button>
                    <button class="btn_2" id="load-button" title="Load local work">
                        <span>Load</span>
                    </button>
                    <input id="openFile" type="file" accept="application/json" hidden>
                </div>
            </div>
        </header>

        <main class="main">
            <aside class="frame">
                <h2>Tasks and TODO</h2>
                <textarea class="frame-textbox" id="todo">TODO: buy a domain</textarea>
                <p>Write your TODOs here.</p>
                <textarea class="frame-textbox">console.log("Made by Bahfo")</textarea>
                <p>This is a validation textarea for JavaScript codes only
                    <br><br>
                   TIP: use <code class="embed-code">Enter+S</code> to save, and 
                   <code class="embed-code">ctrl+Enter</code> to run.
                </p>
            </aside>

            <section class="mainFrame" id="web-only">
                <div class="title-row">
                    <div class="title">
                        <h2>HTML/CSS/JavaScript</h2>
                    </div>

                    <div class="right-options">
                        <button class="btn_1" id="runBtn">Run</button>
                        <button class="btn_1" id="previewBtn">Open in Preview Mode</button>
                    </div>
                </div>

                <div class="lang-row">
                    <button class="btn_3" id="html-button">HTML</button>
                    <button class="btn_3" id="css-button">CSS</button>
                    <button class="btn_3" id="js-button">JavaScript</button>
                </div>

                <div class="code-editor">
                    <div id="html-tab" class="tab-content active">
                        <div id="html-editor" class="monaco-editor"></div>
                    </div>

                    <div id="css-tab" class="tab-content">
                        <div id="css-editor" class="monaco-editor"></div>
                    </div>

                    <div id="js-tab" class="tab-content">
                        <div id="js-editor" class="monaco-editor"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>Write HTML, CSS, and JavaScript on the fly.</p>
        </footer>

        <!-- Monaco Editor-->
        <script>
            window.require = { paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } };
        </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.js"></script>
        <script src="/home/bahaa/Desktop/apps/dreamstudio_web/web_editor/editor.js" defer></script>
    </body>

</html>
