<!DOCTYPE html>
<html>
    <head>
        <script src="calculator.js"></script>
        <title>Two Calculators</title>
    </head>
    <body>
        <div id="boring-calculator">
            <h2>Boring Calculator</h2><br>
            <p>Type your boring numbers here</p>
            <div id="boring-results">
                <p id="calc1-result">0</p>
            </div>
            <div id="boring-buttons">
                <input type="button" value="1" width="10" height="10" onclick="appendOperation('1')">
                <input type="button" value="2" width="10" height="10" onclick="appendOperation('2')">
                <input type="button" value="3" width="10" height="10" onclick="appendOperation('3')">
                <input type="button" value="+" width="20" height="10" onclick="appendOperation('+')">
                <br>
                <input type="button" value="4" width="10" height="10" onclick="appendOperation('4')">
                <input type="button" value="5" width="10" height="10" onclick="appendOperation('5')">
                <input type="button" value="6" width="10" height="10" onclick="appendOperation('6')">
                <input type="button" value="-" width="20" height="10" onclick="appendOperation('-')">
                <br>
                <input type="button" value="7" width="10" height="10" onclick="appendOperation('7')">
                <input type="button" value="8" width="10" height="10" onclick="appendOperation('8')">
                <input type="button" value="9" width="10" height="10" onclick="appendOperation('9')">
                <input type="button" value="*" width="20" height="10" onclick="appendOperation('*')">
                <br>
                <input type="button" value="." width="10" height="10" onclick="appendOperation('.')">
                <input type="button" value="0" width="10" height="10" onclick="appendOperation('0')">
                <input type="button" value="-/+" width="10" height="10" onclick="addSign()">
                <input type="button" value="/" width="20" height="10" onclick="appendOperation('/')">
                <br>
                <input type="button" value="FIND RESULTS" width="10" height="10">
            </div>
        </div>
    </body>
</html>
