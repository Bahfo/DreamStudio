[tool.ruff]
# Target Python version
target-version = "py312"

line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "D",   # pydocstyle (enforces documentation rules)
    "ARG", # flake8-unused-arguments
]

ignore = [
    "D100", # Custom copyright header style in D100
]

[tool.ruff.lint.pydocstyle]
# Google style documentation
convention = "google"

[tool.ruff.format]
# 110-character wrap during automatic formatting
line-length = 110
quote-style = "double"
indent-style = "space"