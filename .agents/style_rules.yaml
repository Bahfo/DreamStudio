# Style rules and code-editing rules for agents
# EXcellent TechStacks - 2026

# These rules are used for DreamCLI. Which must manage how an angent
# will contribute to this repository.
rule-for: ["Agents","AI","OpenCode","Gemini","Big-Pickle","Mimo"]
# Code flag for disabling non-needed features
have-fun: false    # Disaples agent missing-around
be-strict: true    # Enables the agent being strict
be-honest: true    # Enables the agent being honest
read-fully: true   # Makes the agent read files fully
skip-files: false  # Disables the agent skipping files (being lazy)

# Configuration for code review features.
code_review:
  # Whether to disable all code review functionality.
  disable: false
  # The minimum severity level for comments to be generated or shown 
  # (e.g., LOW, MEDIUM, HIGH, CRITICAL).
  comment_severity_threshold: CRITICAL
  # The maximum number of review comments to generate. -1 means no limit.
  max_review_comments: -1
  # Settings specifically for when a pull request is opened.
  pull_request_opened:
    # Whether to offer help when a PR is opened.
    help: false
    # Whether to generate a summary for the PR.
    summary: false
    # Whether to automatically trigger a code review on PR open.
    code_review: true
    # Whether to include draft pull requests in the review process.
    include_drafts: false

# NOTE: Please add any rules you see important