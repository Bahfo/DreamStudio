# Project Type: Empty Project
# COPYRIGHT 2026 - EXcellent TechStacks Projects Initializers

languages: ["cpp"]
version: "studio_default_version"
interpreter_location: "studio_interpreter_defined_location"

project_type: "empty_project"
display_name: "Empty Project"
description: |
  Create a minimal C++ project with essential development files and packages.
  Provide a clean foundation that developers can scaffold and organize according
  to their own requirements. Integrate with DreamStudio's project system and
  support standard C++ development workflows.

initialization:
  directories:
    - "include"
    - "src"
    - "tests"
    - "build"

  files:
    - ".gitignore"
    - ".gitattributes"
    - "LICENSE.md"
    - "README.md"
    - "main.cpp"
    - "CMakeLists.txt"

  templates:
    - target: "src/main.cpp"
      contents: |
        #include <iostream>

        int main() {
            std::cout << "Hello, DreamStudio!" << std::endl;
            return 0;
        }

    - target: ".gitignore"
      contents: |
        build/
        dist/
        cmake-build-*/
        *.o
        *.obj
        *.a
        *.so
        *.so.*
        *.dylib
        *.dll
        *.exe
        .ds/

    - target: ".gitattributes"
      contents: |
        * text=auto
        *.cpp text eol=lf
        *.hpp text eol=lf
        *.h text eol=lf
        *.cmake text eol=lf
        CMakeLists.txt text eol=lf

    - target: "CMakeLists.txt"
      contents: |
        cmake_minimum_required(VERSION 3.20)

        project(EmptyProject
            VERSION 1.0.0
            DESCRIPTION "A minimal C++ project created with DreamStudio"
            LANGUAGES CXX
        )

        set(CMAKE_CXX_STANDARD 20)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)
        set(CMAKE_CXX_EXTENSIONS OFF)

        add_executable(EmptyProject
            main.cpp
        )

        target_include_directories(EmptyProject
            PRIVATE
                ${CMAKE_CURRENT_SOURCE_DIR}/include
        )

        include(CTest)

        if(BUILD_TESTING)
            add_subdirectory(tests)
        endif()

    - target: "tests/CMakeLists.txt"
      contents: |
        # Add test executables and register them with CTest here.
        #
        # Example:
        # add_executable(EmptyProjectTests test_main.cpp)
        # add_test(NAME EmptyProjectTests COMMAND EmptyProjectTests)

    - target: "README.md"
      contents: |
        # Empty Project

        A minimal C++ project scaffold generated by DreamStudio.

        ## Requirements

        - A C++20-compatible compiler
        - CMake 3.20 or later
        - A supported build tool, such as Ninja or Make

        ## Build

        Configure the project:

            cmake -S . -B build

        Compile:

            cmake --build build

        ## Run

        Linux:

            ./build/EmptyProject

        Windows:

            .\build\Debug\EmptyProject.exe

        ## Tests

        Enable and configure tests using CTest:

            ctest --test-dir build --output-on-failure

        ## Project Structure

        - `include/`: Public and private project headers
        - `src/`: Source files for project implementation
        - `tests/`: Test sources and test configuration
        - `build/`: Generated build files and compiled outputs
        - `main.cpp`: Application entry point
        - `CMakeLists.txt`: CMake project configuration

        ## License

        See `LICENSE.md` for licensing terms.

    - target: "LICENSE.md"
      contents: |
        # License

        Specify the applicable license terms for this project before
        distributing or publishing it.
