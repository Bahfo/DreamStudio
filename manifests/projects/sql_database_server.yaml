# Project Type: SQL Database Server
# COPYRIGHT 2026 - EXcellent TechStacks Projects Initializers

languages: ["sql"]
version: "studio_default_version"
interpreter_location: "studio_interpreter_defined_location"

project_type: "sql_database_server"
display_name: "SQL Database Server (PostgreSQL)"
description: |
  Create a PostgreSQL database project with a reproducible local server,
  versioned SQL initialization scripts, persistent database storage,
  and configuration through environment variables.

initialization:
  directories:
    - "sql"
    - "sql/schema"
    - "sql/seeds"
    - "config"
    - "build"

  files:
    - ".gitignore"
    - ".gitattributes"
    - "LICENSE.md"
    - "README.md"
    - "compose.yaml"
    - ".env.example"
    - "sql/schema/001_initial.sql"
    - "sql/seeds/001_initial_data.sql"

  templates:
    - target: "compose.yaml"
      contents: |
        services:
          database:
            image: postgres:17
            restart: unless-stopped
            environment:
              POSTGRES_DB: ${POSTGRES_DB:-dreamstudio}
              POSTGRES_USER: ${POSTGRES_USER:-dreamstudio}
              POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            ports:
              - "127.0.0.1:5432:5432"
            volumes:
              - postgres_data:/var/lib/postgresql/data
              - ./sql/schema:/docker-entrypoint-initdb.d/schema:ro
              - ./sql/seeds:/docker-entrypoint-initdb.d/seeds:ro
            healthcheck:
              test:
                - CMD-SHELL
                - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
              interval: 5s
              timeout: 5s
              retries: 10

        volumes:
          postgres_data:

    - target: ".env.example"
      contents: |
        POSTGRES_DB=dreamstudio
        POSTGRES_USER=dreamstudio
        POSTGRES_PASSWORD=replace_with_a_strong_local_password

    - target: "sql/schema/001_initial.sql"
      contents: |
        CREATE TABLE IF NOT EXISTS projects (
            id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            name VARCHAR(200) NOT NULL,
            description TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
        );

    - target: "sql/seeds/001_initial_data.sql"
      contents: |
        INSERT INTO projects (name, description)
        VALUES ('DreamStudio', 'Initial example project')
        ON CONFLICT DO NOTHING;

    - target: ".gitignore"
      contents: |
        .env
        build/
        .ds/
        *.dump
        *.backup
        database-data/

    - target: ".gitattributes"
      contents: |
        * text=auto
        *.sql text eol=lf
        *.yaml text eol=lf

    - target: "README.md"
      contents: |
        # PostgreSQL Database Project

        ## Requirements
        - Docker Engine
        - Docker Compose plugin

        ## Initialize
        Copy .env.example to .env and replace the password.

        Linux:
        cp .env.example .env

        Windows PowerShell:
        Copy-Item .env.example .env

        Start the server:

        docker compose up -d

        Check health:

        docker compose ps

        Connect using psql:

        docker compose exec database psql -U dreamstudio -d dreamstudio

        ## Important
        PostgreSQL's initialization scripts run only when the data directory
        is first created. Changing SQL files does not rerun initialization
        against an existing database.

        Use versioned migrations for subsequent schema changes. Back up the
        database before removing or replacing persistent storage.

        The example credentials are for local development only.

    - target: "LICENSE.md"
      contents: |
        # License

        Specify the applicable license terms for this project before
        distributing or publishing it.

post_lifecycle:
  - step: "prepare_environment"
    desc: "Create the local environment configuration"
    unix: "cp -n .env.example .env"
    wind: "if (-not (Test-Path .env)) { Copy-Item .env.example .env }"
  - step: "start_database"
    desc: "Start the PostgreSQL database server"
    unix: "docker compose up -d"
    wind: "docker compose up -d"